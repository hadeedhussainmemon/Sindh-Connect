<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient: Deep Ajrak Crimson & Indigo -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#801020" />
      <stop offset="75%" stop-color="#4d0812" />
      <stop offset="100%" stop-color="#09152b" />
    </radialGradient>

    <!-- Sindh Map Outline Gradient: Antique Indus Gold -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d475" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa8218" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="50" cy="50" r="47" fill="url(#bgGrad)" stroke="#d4af37" stroke-width="2.5" />
  
  <!-- Ajrak Inner Ornamental Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="2, 2.5" opacity="0.6" />

  <!-- Stylized Sindh Province Map Silhouette -->
  <!-- Sindh's distinctive geographical shape: Northern Kashmore/Jacobabad neck, Indus valley body, southeastern Thar bulge, southwestern Arabian Sea coast/Karachi delta -->
  <path d="M 46 16 
           C 51 16, 56 18, 59 23 
           C 60 27, 63 32, 65 37 
           C 68 41, 74 46, 78 52 
           C 82 58, 83 66, 81 74 
           C 79 78, 73 83, 67 83 
           C 62 82, 57 80, 52 79 
           C 46 78, 38 80, 31 82 
           C 25 82, 22 79, 23 75 
           C 25 71, 30 68, 32 64 
           C 33 60, 31 55, 30 50 
           C 28 44, 30 38, 34 32 
           C 37 26, 41 19, 46 16 Z" 
        fill="url(#goldGrad)" 
        filter="url(#goldGlow)"
        stroke="#fff" 
        stroke-width="0.5" 
        opacity="0.95" />

  <!-- The Mehran / Indus River flowing through Sindh -->
  <path d="M 50 18 
           Q 54 28, 51 38 
           T 53 54 
           T 46 68 
           T 32 78" 
        fill="none" 
        stroke="#09152b" 
        stroke-width="1.8" 
        stroke-linecap="round" />

  <!-- Little Gold Star over Central Sindh (Bhit Shah / Hala cultural heart) -->
  <circle cx="52" cy="54" r="2.2" fill="#fff" />
</svg>
